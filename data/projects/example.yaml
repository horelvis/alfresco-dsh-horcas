# Analisis read-only del Alfresco actual (stack local gadex-alfresco-docker-git).
# Origen: ACS 7.1.0 Community, Solr 6, PostgreSQL, content store FS.
# El migrador NO escribe en el origen (modo plan sin --execute).
project: gadex-7.1.0
# clone | test | prod. PROD exige un ensayo validado (clone/TEST) sin drift de bloqueo.
stage: test

access:
  mode: ssh                       # enrutado: el ORIGEN (via jdbc) sigue local; el DESTINO va por SSH
  hosts:
    dst-app:
      host: 192.168.100.51
      port: 22
      user: horelvis              # usuario SSH real de la maquina destino
      auth: { type: key, keyFile: ~/.ssh/migrator_dst }   # clave dedicada del migrador (sin passphrase)

source:
  baseUrl: http://localhost/alfresco
  edition: CE
  version: "7.1.0"
  auth: builtin
  database:
    engine: postgresql
    host: localhost
    port: 5432
    name: alfresco
    user: alfresco
  contentStore:
    type: FS
    path: /Users/horelvis/git/gadex-alfresco-docker-git/data/alf-repo-data/contentstore
    via: local
  search:
    engine: solr
    version: "2.0"

target:
  version: "26.2"
  edition: CE
  deployment: compose
  # URL REST del DESTINO (verificacion de version del hop / salud). Override: MIGRATOR_DST_BASE_URL.
  baseUrl: http://192.168.100.51:8080/alfresco
  database:
    engine: postgresql
  contentStore:
    type: FS
    # Si el destino guarda el store en un volumen Docker, usa `volume` (el plugin resuelve su
    # mountpoint real en el host con `docker volume inspect`) y `path` como subruta del volumen:
    #   volume: gadex-7.1.0_alfresco-content   # nombre real: `docker volume ls`
    #   path: contentstore                     # dir.contentstore dentro de dir.root
    path: /alf_data-26/contentstore
  search:
    engine: opensearch

migration:
  contentStrategy: C2
  dbStrategy: D2
  indexStrategy: I2
  parallelism: 4
  coherence:
    mode: full
    # exp.conf.zip (53MB) falto en el origen: se acepta documentado en lugar de bloquear el ensayo.
    policy: WARN

estimation:
  changeRatePerDay: 0.01

jira:
  mode: "off"

ai:
  enabled: false
