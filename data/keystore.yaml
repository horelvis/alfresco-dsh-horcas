# Keystore de METADATOS por defecto de las imagenes Docker de ACS (valores publicos del compose
# oficial de acs-deployment). Deben ser LOS MISMOS que en el ORIGEN: las propiedades cifradas de la
# BD restaurada se descifran con este keystore. Sin ellos la imagen abre su keystore JCEKS como
# PKCS12 y Alfresco no arranca.
# OVERRIDES por entorno (entornos reales con keystore propio):
#   MIGRATOR_KEYSTORE_PASSWORD            -> metadata-keystore.password
#   MIGRATOR_KEYSTORE_METADATA_PASSWORD   -> metadata-keystore.metadata.password
schemaVersion: 1
'encryption.keystore.type': 'JCEKS'
'encryption.cipherAlgorithm': 'DESede/CBC/PKCS5Padding'
'encryption.keyAlgorithm': 'DESede'
'encryption.keystore.location': '/usr/local/tomcat/shared/classes/alfresco/extension/keystore/keystore'
'metadata-keystore.password': 'mp6yc0UD9e'
'metadata-keystore.aliases': 'metadata'
'metadata-keystore.metadata.password': 'oKIWzVdEdA'
'metadata-keystore.metadata.algorithm': 'DESede'
